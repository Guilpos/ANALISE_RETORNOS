<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validador de Convênios</title>
    <!-- Importação do Bootstrap 5 para um visual corporativo instantâneo -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      /* 1. Preparamos a barra original para aceitar animações */
      .barra-esquerda {
        transition: all 0.4s ease-in-out; /* Duração de 0.4 segundos com aceleração e desaceleração suave */
        overflow-x: hidden; /* Impede que os botões e textos "vazem" enquanto a barra espreme */
      }

      /* 2. O novo estado oculto (Adeus, display: none!) */
      .barra-esquerda.oculta {
        min-width: 0 !important;
        width: 0 !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        opacity: 0;
        border: none !important;
      }
      /* ESTILOS DA BARRA LATERAL (PAINEL DE CONTROLE) */
      .card-lateral {
        background-color: white;
        border-radius: 20px;
        padding: 25px 20px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .titulo-lateral {
        color: #00aced; /* Azul claro do seu desenho */
        text-align: center;
        font-size: 16px;
        margin: 0 0 15px 0;
      }

      .grupo-form label {
        display: block;
        font-size: 12px;
        color: #333;
        margin-bottom: 4px;
        font-weight: bold;
        text-align: center;
      }

      .grupo-form input,
      .grupo-form select {
        width: 100%;
        padding: 8px;
        border: 1px solid #00aced;
        border-radius: 4px;
        box-sizing: border-box;
        text-align: center;
        background-color: white;
        cursor: pointer;
      }

      /* Campos de data lado a lado para o período */
      .grupo-datas {
        display: flex;
        gap: 10px;
      }

      /* Botões de Ação */
      .btn-acao {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        margin-top: 5px;
      }

      .btn-buscar {
        background-color: #3498db;
      }
      .btn-buscar:hover {
        background-color: #2980b9;
      }

      .btn-upload {
        background-color: #2ecc71;
      }
      .btn-upload:hover {
        background-color: #27ae60;
      }

      .btn-excluir {
        background-color: #e74c3c;
        margin-top: 15px;
      }
      .btn-excluir:hover {
        background-color: #c0392b;
      }

      .divisor-linha {
        border: 0;
        border-top: 1px dashed #ccc;
        margin: 10px 0;
      }
      /* Zera as margens e faz a tela ocupar 100% da janela */
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: sans-serif;
      }

      /* O contêiner pai que segura as 3 colunas */
      .layout-principal {
        display: flex;
        height: 100vh;
        overflow: hidden; /* Trava a rolagem da página inteira */
      }

      /* 1. BARRA ESQUERDA (Formulário) */
      .barra-esquerda {
        width: 400px;
        background-color: #9b59b6; /* Roxo do seu desenho */
        padding: 20px;
        transition: 0.3s all ease; /* Animação para retrair */
      }
      /* Classe que será ativada via JavaScript para encolher o menu */
      .barra-esquerda.recolhida {
        width: 0;
        padding: 0;
        overflow: hidden;
      }

      /* 2. CENTRO (Scroll Horizontal com os Cards) */
      .area-central {
        flex: 1; /* Ocupa todo o espaço que sobrar */
        background-color: #f4f6f9;
        padding: 20px;
        display: flex;
        gap: 20px;
        overflow-x: auto; /* Cria a barra de rolagem horizontal */
        align-items: flex-start;
      }

      .card-arquivo {
        min-width: 890px; /* Aumentamos para caber a pizza e as barras com folga */
        flex-shrink: 0; /* A MÁGICA: Impede que o cartão seja espremido quando houver muitos na tela */
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
      }

      /* 3. BARRA DIREITA (Tendência e IA) */
      .barra-direita {
        width: 400px;
        background-color: #d2c9eb; /* Roxo claro */
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
    </style>

    <!-- Novo Botão Flutuante Fixo -->
    <button
      id="btn-toggle-menu"
      class="btn btn-dark"
      style="
        position: fixed;
        bottom: 30px;
        left: 30px;
        z-index: 9999;
        border-radius: 50px;
        padding: 10px 20px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
      "
    >
      <span id="icone-menu">◀</span>
      <span style="font-size: 14px">Filtros</span>
    </button>

    <div class="layout-principal">
      <!-- BARRA ESQUERDA -->
      <aside class="barra-esquerda" id="menu-lateral">
        <div class="card-lateral">
          <h3 class="titulo-lateral">Painel de Controle</h3>

          <!-- PARÂMETROS GERAIS (Usados para Buscar, Upload e Excluir) -->
          <div class="grupo-form">
            <label>Código do Convênio</label>
            <select id="codigo_convenio">
              <option value="">-- Selecione --</option>
              <option value="1">1 - INSS</option>
              <option value="71">71 - PREF. JOÃO PESSOA</option>
              <option value="82">82 - PREF. NATAL</option>
            </select>
          </div>

          <div class="grupo-form">
            <label>Consignatária (Banco)</label>
            <select id="consignataria">
              <option value="">-- Selecione --</option>
              <option value="CAPITAL_CONSIG">Capital Consig</option>
              <option value="CIASPREV">Ciasprev</option>
              <option value="CLICKBANK">Clickbank</option>
              <option value="HOJE_PREVIDENCIA">Hoje Previdência</option>
              <option value="BEM_CARTOES">Bem Cartões</option>
            </select>
          </div>

          <div class="grupo-form">
            <label>Produto</label>
            <select id="produto">
              <option value="">-- Selecione --</option>
              <option value="EMPRESTIMO">Empréstimo</option>
              <option value="CARTAO_CREDITO">Cartão de Crédito</option>
              <option value="CARTAO_BENEFICIO">Cartão Benefício</option>
            </select>
          </div>

          <div class="grupo-form">
            <label>Período (Competência)</label>
            <div class="grupo-datas">
              <!-- Data Inicial -->
              <input
                type="date"
                id="competencia_inicio"
                title="Competência Inicial"
              />
              <!-- Data Final (Opcional) -->
              <input
                type="date"
                id="competencia_fim"
                title="Competência Final (Opcional)"
              />
            </div>
            <small
              style="
                display: block;
                text-align: center;
                font-size: 10px;
                color: #888;
                margin-top: 4px;
              "
              >Deixe a data final vazia para ver apenas 1 mês</small
            >
          </div>
          <small
            style="
              display: block;
              text-align: center;
              font-size: 10px;
              color: #888;
              margin-top: 4px;
            "
            >Deixe a data final vazia para ver apenas 1 mês</small
          >
        </div>

        <hr class="divisor-linha" />

        <!-- 1º BOTÃO: APENAS BUSCAR (Filtro) -->
        <button id="btn-buscar" class="btn-acao btn-buscar">
          🔍 Filtrar Relatórios
        </button>

        <hr class="divisor-linha" />

        <!-- 2º BOTÃO: UPLOAD DE NOVO ARQUIVO -->
        <div class="grupo-form" style="margin-top: 5px">
          <label>Arquivo de Retorno (.csv, .xlsx)</label>
          <input
            type="file"
            id="arquivo"
            style="border: 1px solid #7f8c8d; background: #ecf0f1"
          />
        </div>
        <button id="btn-enviar" class="btn-acao btn-upload">
          ⬆️ Processar Arquivo
        </button>

        <!-- 3º BOTÃO: EXCLUSÃO DE LOTE (Perigo) -->
        <button id="btn-excluir" class="btn-acao btn-excluir">
          🗑️ Excluir Lote
        </button>

        <!-- Alerta de Status -->
        <div
          id="mensagem-alerta"
          style="
            display: none;
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
          "
        ></div>
      </aside>

      <!-- ÁREA CENTRAL -->
      <main class="area-central" style="padding: 20px; position: relative">
        <!-- A sua div area-cards continua aqui embaixo -->
        <div id="area-cards" style="display: flex; gap: 20px"></div>
      </main>

      <!-- BARRA DIREITA -->
      <aside class="barra-direita">
        <h4 style="text-align: center; color: #555; margin-bottom: 0">
          Tendência (Mês a Mês)
        </h4>

        <!-- Esta DIV é a "jaula" que vai segurar o tamanho do gráfico -->
        <div
          style="
            background-color: white;
            border-radius: 20px;
            padding: 15px;
            height: 300px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
          "
        >
          <canvas id="chartTendencia"></canvas>
        </div>

        <!-- O espaço reservado para o resumo da IA que faremos a seguir -->
        <!-- Título com Switch de Ativação -->
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 20px;
            margin-bottom: 5px;
          "
        >
          <h4 style="text-align: center; color: #555; margin: 0">
            Insight da IA
          </h4>

          <div class="form-check form-switch" style="margin: 0">
            <input
              class="form-check-input"
              type="checkbox"
              id="toggle-ia"
              unchecked
              style="cursor: pointer"
            />
            <label
              class="form-check-label"
              for="toggle-ia"
              style="font-size: 11px; color: #888; cursor: pointer"
              >Ativar</label
            >
          </div>
        </div>

        <!-- A div caixa-ia continua igual -->
        <div
          id="caixa-ia"
          style="
            background-color: white;
            border-radius: 20px;
            padding: 20px;
            flex: 1;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
          "
        >
          <p
            style="
              color: #888;
              text-align: center;
              font-size: 14px;
              margin-top: 50px;
            "
          >
            A inteligência artificial irá gerar o resumo aqui...
          </p>
        </div>
        <p
          style="
            color: #888;
            text-align: center;
            font-size: 14px;
            margin-top: 50px;
          "
        ></p>
      </aside>
    </div>
  </head>
  <!-- O MOTOR: Aqui é onde o JavaScript puro faz a comunicação com o FastAPI -->
  <script>
    // 1. "Capturamos" os elementos que sobraram no novo layout
    const btnEnviar = document.getElementById("btn-enviar");
    const caixaAlerta = document.getElementById("mensagem-alerta");

    // Função auxiliar atualizada para exibir a caixa de aviso no novo design
    function mostrarAlerta(mensagem, corFundo) {
      caixaAlerta.style.backgroundColor = corFundo;
      caixaAlerta.style.color = "white";
      caixaAlerta.textContent = mensagem;
      caixaAlerta.style.display = "block";
    }

    // 2. Interceptamos o clique direto no botão de Upload
    btnEnviar.addEventListener("click", async function () {
      // Pega o arquivo físico anexado no input
      const inputArquivo = document.getElementById("arquivo");
      const arquivoFisico = inputArquivo.files[0];

      // Trava de segurança: se o usuário esquecer de anexar, avisa e cancela o envio
      if (!arquivoFisico) {
        mostrarAlerta(
          "Por favor, anexe um arquivo antes de processar.",
          "#e74c3c",
        ); // Vermelho
        return;
      }

      // Altera o estado do botão para "Processando"
      const textoOriginal = btnEnviar.textContent;
      btnEnviar.textContent = "Processando...";
      btnEnviar.disabled = true;
      caixaAlerta.style.display = "none"; // Esconde mensagens anteriores

      // 3. Montamos o pacote de dados EXATAMENTE como o FastAPI pede
      const dadosFormulario = new FormData();
      dadosFormulario.append(
        "codigo_convenio",
        document.getElementById("codigo_convenio").value,
      );
      dadosFormulario.append(
        "consignataria",
        document.getElementById("consignataria").value,
      );
      dadosFormulario.append(
        "produto",
        document.getElementById("produto").value,
      );
      // Atenção aqui: estamos pegando a data do novo campo "competencia_inicio"
      dadosFormulario.append(
        "competencia",
        document.getElementById("competencia_inicio").value,
      );
      dadosFormulario.append("arquivo", arquivoFisico);

      try {
        // 4. Mandamos os dados para a nuvem
        const resposta = await fetch(`${API_URL}/api/upload`, {
          method: "POST",
          body: dadosFormulario,
        });

        if (resposta.ok) {
          mostrarAlerta("Upload concluído com sucesso!", "#2ecc71"); // Verde

          inputArquivo.value = ""; // Limpa o campo do arquivo após sucesso

          carregarDashboard(); // Atualiza os gráficos sozinhos
        } else {
          mostrarAlerta("Erro ao processar o arquivo no servidor.", "#e74c3c"); // Vermelho
        }
      } catch (erro) {
        console.error("Erro no upload:", erro);
        mostrarAlerta("Erro de conexão com a API.", "#e74c3c");
      } finally {
        // Devolve o botão ao estado original independente do resultado
        btnEnviar.textContent = textoOriginal;
        btnEnviar.disabled = false;
      }
    });
    // Interceptamos o clique no botão de Excluir Lote
    const btnExcluir = document.getElementById("btn-excluir");

    btnExcluir.addEventListener("click", async function () {
      // 1. Capturar os valores atuais dos filtros no painel lateral
      const convenio = document.getElementById("codigo_convenio").value;
      const consignataria = document.getElementById("consignataria").value;
      const produto = document.getElementById("produto").value;
      const compInicio = document.getElementById("competencia_inicio").value;

      // 2. Trava de Segurança no Frontend: Exige preenchimento total
      if (!convenio || !consignataria || !produto || !compInicio) {
        mostrarAlerta(
          "Preencha Convênio, Consignatária, Produto e Competência Inicial para excluir.",
          "#f39c12",
        ); // Laranja
        return; // Cancela a execução
      }

      // 3. Confirmação Dupla (Evita cliques acidentais)
      const mensagemConfirmacao = `ATENÇÃO! Isso apagará permanentemente todos os registros com os seguintes parâmetros:\n\nConvênio: ${convenio}\nBanco: ${consignataria}\nProduto: ${produto}\nCompetência: ${compInicio}\n\nDeseja realmente continuar?`;

      if (!confirm(mensagemConfirmacao)) {
        return; // Se o usuário clicar em "Cancelar", a função morre aqui.
      }

      // Altera o estado do botão visualmente
      const textoOriginal = btnExcluir.textContent;
      btnExcluir.textContent = "Excluindo...";
      btnExcluir.disabled = true;
      caixaAlerta.style.display = "none"; // Esconde mensagens anteriores

      try {
        // 4. Montar a URL com os parâmetros exatos para a API
        const parametros = new URLSearchParams({
          codigo_convenio: convenio,
          consignataria: consignataria,
          produto: produto,
          competencia_inicio: compInicio,
        });

        // 5. Disparar a requisição usando o método DELETE
        const resposta = await fetch(
          `${API_URL}/api/relatorios/arquivos/excluir-lote?${parametros.toString()}`,
          {
            method: "DELETE",
          },
        );

        const dados = await resposta.json();

        if (resposta.ok) {
          if (dados.status === "sucesso") {
            mostrarAlerta(dados.mensagem, "#2ecc71"); // Verde

            // Recarrega o dashboard. Como os dados foram apagados, a tela ficará em branco e mostrará "Nenhum dado encontrado"
            carregarDashboard();
          } else {
            // Caso o backend avise que não achou nada para apagar
            mostrarAlerta(dados.mensagem, "#f39c12"); // Laranja
          }
        } else {
          // Caso a API devolva o erro 400 da nossa trava de segurança do Python
          mostrarAlerta(dados.detail || "Erro ao excluir o lote.", "#e74c3c"); // Vermelho
        }
      } catch (erro) {
        console.error("Erro na exclusão:", erro);
        mostrarAlerta("Erro de conexão com o servidor.", "#e74c3c");
      } finally {
        // Devolve o botão ao estado original independente do resultado
        btnExcluir.textContent = textoOriginal;
        btnExcluir.disabled = false;
      }
    });

    // Intercepta o clique no botão Flutuante
    document
      .getElementById("btn-toggle-menu")
      .addEventListener("click", function () {
        const barraEsquerda = document.querySelector(".barra-esquerda");
        const iconeMenu = document.getElementById("icone-menu");

        // Ativa ou desativa a classe que oculta a barra
        barraEsquerda.classList.toggle("oculta");

        // Muda a setinha do botão para dar feedback visual de qual lado a barra vai
        if (barraEsquerda.classList.contains("oculta")) {
          iconeMenu.textContent = "▶"; // Mostrar
        } else {
          iconeMenu.textContent = "◀"; // Esconder
        }
      });

    // Função auxiliar para exibir a caixa de aviso verde ou vermelha
    function mostrarAlerta(mensagem, tipo) {
      caixaAlerta.className = `alert mt-4 alert-${tipo}`;
      caixaAlerta.textContent = mensagem;
      caixaAlerta.style.display = "block";
    }

    // Endereço base da sua API no Render
    const API_URL = "https://api-validador-convenios.onrender.com";

    let chartPizzaInstancia = null;
    let chartBarrasInstancia = null;
    let chartTendenciaInstancia = null;

    async function carregarDashboard() {
      try {
        // 1. CAPTURAR OS FILTROS DA BARRA LATERAL
        const convenio = document.getElementById("codigo_convenio").value;
        const consignataria = document.getElementById("consignataria").value;
        const produto = document.getElementById("produto").value;
        const compInicio = document.getElementById("competencia_inicio").value;
        const compFim = document.getElementById("competencia_fim").value;

        // 2. MONTAR A URL DINÂMICA
        // O URLSearchParams ajuda a criar aquela string "?convenio=71&produto=EMPRESTIMO"
        const parametros = new URLSearchParams();

        if (convenio) parametros.append("codigo_convenio", convenio);
        if (consignataria) parametros.append("consignataria", consignataria);
        if (produto) parametros.append("produto", produto);
        if (compInicio) parametros.append("competencia_inicio", compInicio);
        if (compFim) parametros.append("competencia_fim", compFim);

        const queryString = parametros.toString();
        // Se tiver parâmetros, adiciona a interrogação. Se não, chama a rota pura (traz tudo).
        const endpoint = queryString
          ? `/api/relatorios/dashboard/resumo?${queryString}`
          : "/api/relatorios/dashboard/resumo";

        const urlFinal = `${API_URL}${endpoint}`;

        // 3. FAZER A BUSCA NA NUVEM
        const resposta = await fetch(urlFinal);

        if (!resposta.ok) {
          throw new Error("Erro ao carregar dados do dashboard.");
        }

        const dados = await resposta.json();

        // 4. DESENHAR OS GRÁFICOS (Mantido igual)
        const areaCards = document.getElementById("area-cards");
        areaCards.innerHTML = ""; // Limpa a tela de boas-vindas ou gráficos anteriores

        // Verifica se a API não trouxe nenhum arquivo
        if (!dados.cards_arquivos || dados.cards_arquivos.length === 0) {
          areaCards.innerHTML = `
                        <div style="width: 100%; text-align: center; margin-top: 50px; color: #666;">
                            <h3>Nenhum dado encontrado</h3>
                            <p>Tente ajustar os filtros de pesquisa ou faça o upload de um novo arquivo.</p>
                        </div>`;
          return; // Para a execução aqui
        }

        // FUNÇÃO AUXILIAR: Quebra textos longos para o Chart.js ler como múltiplas linhas
        function formatarLabelMultiplasLinhas(texto, tamanhoMaximo = 20) {
            if (!texto) return ["Não Informado"];
            if (texto.length <= tamanhoMaximo) return texto; // Se for curto, retorna normal
            
            const palavras = texto.split(' ');
            const linhas = [];
            let linhaAtual = '';
            
            palavras.forEach(palavra => {
                // Se adicionar a próxima palavra for estourar o limite, guarda a linha e começa outra
                if ((linhaAtual + palavra).length > tamanhoMaximo) {
                    if (linhaAtual.trim() !== '') linhas.push(linhaAtual.trim());
                    linhaAtual = palavra + ' ';
                } else {
                    linhaAtual += palavra + ' ';
                }
            });
            if (linhaAtual.trim() !== '') linhas.push(linhaAtual.trim());
            
            return linhas; // Retorna a matriz que o Chart.js entende como quebra de linha
        }

        // Varre a lista de arquivos e desenha os cards dinâmicos
        dados.cards_arquivos.forEach((arquivo, index) => {
          // 1. O Robô Mapeador de Cores que já fizemos
          const coresExatas = arquivo.grafico_pizza.labels.map((label) => {
            const texto = label.toUpperCase();
            if (texto.includes("ACATADO INTEGRAL") || texto === "ACATADO")
              return "#2ea44f";
            if (texto.includes("PARCIAL")) return "#f39c12";
            if (texto.includes("ZERADO") || texto.includes("REJEITADO"))
              return "#e74c3c";
            return "#95a5a6";
          });

          // 2. CONSTRUÇÃO DO RESUMO FINANCEIRO
          // Soma todos os valores para descobrir o 100%
          const totalFinanceiro =
            arquivo.grafico_pizza.valores_financeiros.reduce(
              (a, b) => a + b,
              0,
            );

          let htmlValores = `<div style="margin-top: 20px; background: #f4f6f9; border-radius: 8px; padding: 15px; width: 100%;">`;
          // ... (o trecho onde você calcula o totalFinanceiro e faz o forEach das fatias da pizza continua igual) ...

            // -----------------------------------------------------------------
            // NOVA LÓGICA: CÁLCULO DE VARIAÇÃO MÊS A MÊS (MoM)
            // -----------------------------------------------------------------
            let percentualDiferencaHtml = '';
            
            // O index indica em qual arquivo estamos (0 é o primeiro, 1 é o segundo...)
            if (index === 0) {
                // No primeiro cartão, não temos mês anterior para comparar
                percentualDiferencaHtml = `<span style="font-size: 11px; color: #7f8c8d; margin-left: 5px;">(--)</span>`;
            } else {
                // Captura os dados do arquivo imediatamente anterior na lista
                const arquivoAnterior = dados.cards_arquivos[index - 1];
                const totalAnterior = arquivoAnterior.grafico_pizza.valores_financeiros.reduce((a, b) => a + b, 0);
                
                if (totalAnterior > 0) {
                    // Fórmula clássica de variação percentual: ((Atual - Anterior) / Anterior) * 100
                    const diferenca = ((totalFinanceiro - totalAnterior) / totalAnterior) * 100;
                    
                    // Formata com 2 casas decimais e troca o ponto por vírgula no padrão brasileiro
                    const diferencaFormatada = Math.abs(diferenca).toFixed(2).replace('.', ',');
                    
                    // Define a cor e o sinal (+ ou -) dinamicamente
                    if (diferenca > 0) {
                        percentualDiferencaHtml = `<span style="font-size: 11px; color: #2ecc71; margin-left: 5px;">(+${diferencaFormatada}%)</span>`; // Verde
                    } else if (diferenca < 0) {
                        percentualDiferencaHtml = `<span style="font-size: 11px; color: #e74c3c; margin-left: 5px;">(-${diferencaFormatada}%)</span>`; // Vermelho
                    } else {
                        percentualDiferencaHtml = `<span style="font-size: 11px; color: #7f8c8d; margin-left: 5px;">(0,00%)</span>`; // Cinza
                    }
                } else {
                    percentualDiferencaHtml = `<span style="font-size: 11px; color: #7f8c8d; margin-left: 5px;">(--)</span>`;
                }
            }
            

          arquivo.grafico_pizza.labels.forEach((label, index) => {
            const valor = arquivo.grafico_pizza.valores_financeiros[index];
            const percentual =
              totalFinanceiro > 0
                ? ((valor / totalFinanceiro) * 100).toFixed(1)
                : 0;
            const valorBRL = valor.toLocaleString("pt-BR", {
              style: "currency",
              currency: "BRL",
            });
            const cor = coresExatas[index];

            htmlValores += `
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px; border-left: 4px solid ${cor}; padding-left: 8px; font-size: 12px;">
                        <span style="color: #555;">${label}</span>
                        <span style="font-weight: bold; color: #333;">${valorBRL} <span style="font-size: 10px; color: #888; margin-left: 5px;">(${percentual}%)</span></span>
                    </div>
                `;
          });

          // Formata o valor atual em Reais
          const totalBRL = totalFinanceiro.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
          
          // Injeta o Total e o Percentual juntos na mesma linha
          htmlValores += `
              <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px; border-top: 1px dashed #ccc; padding-top: 10px; font-weight: bold; font-size: 13px; color: #2c3e50;">
                  <span>TOTAL PROCESSADO</span>
                  <span>${totalBRL} ${percentualDiferencaHtml}</span>
              </div>
          </div>`;

          // 3. Montagem do HTML com o Resumo Injetado
          const cardHTML = `
                <div class="card-arquivo">
                    <h4 style="text-align: center; color: #555; margin-top: 0; margin-bottom: 20px;">${arquivo.nome_arquivo}</h4>
                    
                    <div style="display: flex; gap: 20px; align-items: flex-start;">
                        <!-- Coluna da Esquerda: Pizza + Valores Financeiros -->
                        <div style="flex: 1; min-width: 290px; display: flex; flex-direction: column; align-items: center;">
                            <div style="width: 100%; max-width: 220px;">
                                <canvas id="pizza-${arquivo.id_arquivo}"></canvas>
                            </div>
                            ${htmlValores}
                        </div>
                        
                        <!-- Coluna da Direita: Gráfico de Barras -->
                        <div style="flex: 1; min-width: 500px; display: flex; flex-direction: column;">
                            <h5 style="text-align: center; margin-top: 0; margin-bottom: 10px; color: #666; font-size: 13px; font-weight: normal;">Volume de Inconsistências</h5>
                            <canvas id="barras-${arquivo.id_arquivo}"></canvas>
                        </div>
                    </div>
                </div>
            `;

          areaCards.insertAdjacentHTML("beforeend", cardHTML);

          // Desenhando a Pizza com as cores fixadas e Tooltip inteligente
          new Chart(document.getElementById(`pizza-${arquivo.id_arquivo}`).getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: arquivo.grafico_pizza.labels,
                    datasets: [{
                        data: arquivo.grafico_pizza.quantidades,
                        backgroundColor: coresExatas
                    }]
                },
                options: { 
                    responsive: true, 
                    plugins: { 
                        legend: { 
                            position: 'bottom' 
                        },
                      // A MÁGICA DO TOOLTIP ACONTECE AQUI
                      tooltip: {
                          callbacks: {
                              label: function(context) {
                                  // 1. Pega o nome da fatia (ex: "Acatado Integral")
                                  // let rotulo = context.label || '';
                                  // if (rotulo) {
                                  //     rotulo += ': ';
                                  // }
                                  let rotulo = '';
                                  
                                  // 2. Pega a quantidade bruta daquela fatia específica
                                  const valor = context.raw;
                                  
                                  // 3. Soma todas as fatias do gráfico para descobrir quanto é o 100%
                                  const total = context.dataset.data.reduce((acumulador, atual) => acumulador + atual, 0);
                                  
                                  // 4. Calcula a porcentagem com 1 casa decimal
                                  const percentual = total > 0 ? ((valor / total) * 100).toFixed(1) : 0;
                                  
                                  // 5. Monta o texto final que vai aparecer na tela
                                  rotulo += `${valor} registros (${percentual}%)`;
                                  return rotulo;
                              }
                          }
                      }
                    } 
                }
            });

          // Passamos as labels originais pelo nosso "cortador"
          const labelsBarrasFormatadas = arquivo.grafico_barras.labels.map(label => formatarLabelMultiplasLinhas(label, 25));

          // Desenhando o Gráfico de Barras com as legendas novas
          new Chart(document.getElementById(`barras-${arquivo.id_arquivo}`).getContext('2d'), {
              type: 'bar', // ou 'horizontalBar' se você estiver usando barras laterais
              data: {
                  labels: labelsBarrasFormatadas, // A MÁGICA ACONTECE AQUI
                  datasets: [{
                      label: 'Quantidade',
                      data: arquivo.grafico_barras.quantidades,
                      backgroundColor: '#3498db'
                  }]
              },
              options: { 
                  responsive: true, 
                  plugins: { legend: { display: false }, 
                  // A MÁGICA DO TOOLTIP ACONTECE AQUI
                  tooltip: {
                    callbacks: {
                        label: function(context) {
                            // 1. Pega o nome da fatia (ex: "Acatado Integral")
                            // let rotulo = context.label || '';
                            // if (rotulo) {
                            //     rotulo += ': ';
                            // }
                            let rotulo = '';
                            
                            // 2. Pega a quantidade bruta daquela fatia específica
                            const valor = context.raw;
                            
                            // 3. Soma todas as fatias do gráfico para descobrir quanto é o 100%
                            const total = context.dataset.data.reduce((acumulador, atual) => acumulador + atual, 0);
                            
                            // 4. Calcula a porcentagem com 1 casa decimal
                            const percentual = total > 0 ? ((valor / total) * 100).toFixed(1) : 0;
                            
                            // 5. Monta o texto final que vai aparecer na tela
                            rotulo += `${valor} registros (${percentual}%)`;
                            return rotulo;
                        }
                      }
                    }  
                  },
                  scales: {
                      y: { beginAtZero: true }
                  },
              }
          });
        });

        // Desenha a Barra Direita (Gráfico de Tendência Fixo)
        if (!dados.grafico_tendencia) return;
        const ctxTendencia = document
          .getElementById("chartTendencia")
          .getContext("2d");
        if (chartTendenciaInstancia) chartTendenciaInstancia.destroy();

        chartTendenciaInstancia = new Chart(ctxTendencia, {
          type: "line",
          data: {
            labels: dados.grafico_tendencia.labels,
            datasets: [
              {
                label: "Acatado",
                data: dados.grafico_tendencia.aceitos,
                borderColor: "#2ea44f",
                backgroundColor: "rgba(46, 164, 79, 0.1)",
                fill: true,
                tension: 0.3,
              },
              {
                label: "Rejeitado",
                data: dados.grafico_tendencia.rejeitados,
                borderColor: "#d73a49",
                backgroundColor: "rgba(215, 58, 73, 0.1)",
                fill: true,
                tension: 0.3,
              },
              {
                label: "Parcial",
                data: dados.grafico_tendencia.parciais,
                borderColor: "#f39c12",
                backgroundColor: "rgba(215, 58, 73, 0.1)",
                fill: true,
                tension: 0.3,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: "top" } },
          },
        });
        // 3. O PONTO DE IGNIÇÃO DA IA (COM TRAVA DE SEGURANÇA)
        const botaoIA = document.getElementById("toggle-ia");

        // Só dispara a IA se o botão estiver marcado (checked)
        if (botaoIA && botaoIA.checked) {
          gerarResumoIA(dados);
        } else {
          // Se estiver desligado, limpa a caixa e avisa que está em modo de teste
          document.getElementById("caixa-ia").innerHTML =
            '<p style="color: #aaa; text-align: center; font-size: 13px; margin-top: 50px;">⏸️ Modo de teste visual ativo.<br>Geração de insight desativada.</p>';
        }
      } catch (erro) {
        console.error("Erro ao desenhar gráficos:", erro);
      }
    }

    async function gerarResumoIA(dadosDashboard) {
      const caixaIA = document.getElementById("caixa-ia");

      // Mostra um indicador de carregamento charmoso enquanto o Python trabalha
      caixaIA.innerHTML =
        '<p style="color: #888; text-align: center; font-size: 14px; margin-top: 50px;">⏳ A IA está analisando os resultados...</p>';

      try {
        const resposta = await fetch(
          `${API_URL}/api/relatorios/dashboard/gerar-insight`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            // Empacotamos todos os dados matemáticos do painel e mandamos pro backend
            body: JSON.stringify({ resumo_dados: dadosDashboard }),
          },
        );

        const dadosIA = await resposta.json();

        if (resposta.ok) {
          // Limpamos possíveis formatações markdown (**) que a IA possa devolver e injetamos o texto
          const textoLimpo = dadosIA.insight
            .replace(/\*\*/g, "")
            .replace(/\*/g, "");

          // Um pequeno selo indicando se a resposta veio do Cache (⚡) ou se foi gerada na hora (🤖)
          const iconeOrigem =
            dadosIA.status === "cache" ? "⚡ (Cache)" : "🤖 (Gerado)";

          caixaIA.innerHTML = `
                <p style="color: #333; font-size: 13px; line-height: 1.6; text-align: justify; margin: 0;">
                    ${textoLimpo}
                </p>
                <div style="text-align: right; margin-top: 15px; font-size: 10px; color: #aaa;">
                    ${iconeOrigem}
                </div>
            `;
        } else {
          caixaIA.innerHTML = `<p style="color: #e74c3c; font-size: 13px; text-align: center;">Erro da API ao gerar insight.</p>`;
        }
      } catch (erro) {
        console.error("Erro na comunicação com a IA:", erro);
        caixaIA.innerHTML = `<p style="color: #e74c3c; font-size: 13px; text-align: center;">Sem conexão com o serviço de Inteligência Artificial.</p>`;
      }
    }

    // Executa a função assim que a página é carregada
    // Atrela a função de carregar o dashboard ao clique do botão de filtro
    document
      .getElementById("btn-buscar")
      .addEventListener("click", carregarDashboard);
  </script>
</html>
